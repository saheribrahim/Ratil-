<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ratil · Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
    .admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .admin-table-wrap{overflow-x:auto;margin-top:16px}
    table{width:100%;border-collapse:collapse;text-align:left}
    th,td{padding:10px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
    th{color:var(--mute);font-size:13px}
    #notice{color:var(--mute)}
  </style>
</head>
<body>
<main>
  <div class="admin-head">
    <div><h1>Ratil · Admin</h1><div class="sub">لوحة إدارة المستخدمين</div></div>
    <div><a href="index.html" style="color:var(--accent)">العودة للموقع</a> · <button id="logout" type="button">تسجيل الخروج</button></div>
  </div>
  <section class="admin-card">
    <h2>المستخدمون المسجلون</h2>
    <p id="notice">جارٍ التحقق من الحساب…</p>
    <div id="usersArea" class="admin-table-wrap" hidden></div>
  </section>
</main>
<script>
(() => {
  const ADMIN_EMAIL = "ssaheror@gmail.com";
  const notice = document.getElementById("notice");
  const usersArea = document.getElementById("usersArea");
  const sessionEmail = (localStorage.getItem("ratil-session") || "").toLowerCase();
  if (sessionEmail !== ADMIN_EMAIL) {
    notice.textContent = "غير مصرح لك بعرض هذه الصفحة. سجّل الدخول بحساب المشرف.";
    setTimeout(() => { window.location.replace("index.html"); }, 1600);
    return;
  }
  let users = {};
  try { users = JSON.parse(localStorage.getItem("ratil-users") || "{}"); } catch (_) {}
  const entries = Object.values(users).filter(user => user && typeof user === "object");
  notice.textContent = `عدد الحسابات المحفوظة في هذا المتصفح: ${entries.length}. هذه القائمة محلية ولا تشمل الأجهزة الأخرى.`;
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  thead.innerHTML = "<tr><th>اسم المستخدم</th><th>البريد الإلكتروني</th></tr>";
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  for (const user of entries) {
    const row = document.createElement("tr");
    const nameCell = document.createElement("td");
    const emailCell = document.createElement("td");
    nameCell.textContent = user.username || "—";
    emailCell.textContent = user.email || "—";
    row.append(nameCell, emailCell);
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  usersArea.replaceChildren(table);
  usersArea.hidden = false;
  document.getElementById("logout").addEventListener("click", () => {
    localStorage.removeItem("ratil-session");
    window.location.replace("index.html");
  });
})();
</script>
</body>
</html>
