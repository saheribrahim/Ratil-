<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ratil · Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --page-bg: #061b17;
      --card-bg: #f5f5f5;
      --card-border: #dfe6e0;
      --title: rgba(18, 62, 53, 0.75);
      --muted: rgba(26, 67, 57, 0.7);
      --soft: rgba(26, 67, 57, 0.78);
      --line: rgba(17, 39, 32, 0.18);
      --item: rgba(26, 67, 57, 0.82);
      --accent: #1f7a5a;
      --danger: #c54a3d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--page-bg);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--title);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px 18px;
    }

    main {
      width: min(100%, 1200px);
      background: rgba(0,0,0,0.04);
      border-radius: 18px;
      padding: 16px 18px 20px;
      min-height: 200px;
    }

    .panel {
      background: var(--card-bg);
      border-radius: 28px;
      border: 1px solid var(--card-border);
      min-height: 230px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 26px 32px 28px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title-row h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 44px);
      line-height: 1.2;
      color: rgba(16, 49, 43, 0.88);
      letter-spacing: 0.15px;
      font-weight: 700;
      font-style: normal;
      text-align: center;
    }

    .title-row .arabic {
      font-family: "Tahoma", "Segoe UI", sans-serif;
      font-weight: 600;
      color: rgba(16, 49, 43, 0.75);
      font-size: clamp(26px, 3vw, 42px);
    }

    .subtitle {
      margin: 0 0 10px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
      direction: rtl;
    }

    .count {
      margin: 8px 0 14px;
      color: rgba(22, 57, 49, 0.86);
      font-size: 18px;
      text-align: center;
      direction: rtl;
    }

    .count strong {
      font-weight: 600;
    }

    .users {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: rgba(18, 52, 44, 0.9);
    }

    .users li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(18px, 2vw, 28px);
      line-height: 1.8;
      direction: rtl;
      color: var(--item);
      font-weight: 500;
      text-align: right;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(15, 55, 48, 0.9);
      transform: translateY(-2px);
      margin-left: 8px;
    }

    .name {
      color: rgba(22, 57, 49, 0.96);
      font-weight: 600;
    }

    .email {
      color: rgba(24, 57, 49, 0.8);
      font-weight: 500;
      direction: ltr;
      unicode-bidi: plaintext;
    }

    .admin-only {
      display: none;
    }

    @media (max-width: 480px) {
      main { padding: 10px; }
      .panel { padding: 18px 18px 20px; }
      .title-row h1 { font-size: 24px; }
      .title-row .arabic { font-size: 24px; }
      .subtitle, .count { font-size: 15px; }
      .users li { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-label="Registered users panel">
      <div class="title-row">
        <h1>Registered users</h1>
        <span class="arabic">المستخدمون المسجلون</span>
      </div>

      <p class="subtitle">هذه القائمة تحتوي على جميع الحسابات المسجلة في هذا المتصفح فقط. لا تشمل الأجهزة الأخرى.</p>

      <div class="count"><strong>Total accounts:</strong> 1</div>

      <ul id="usersList" class="users" aria-live="polite">
        <li><span class="dot"></span><span class="name">saher</span><span class="email">— ssaheror@gmail.com</span></li>
      </ul>
    </section>
  </main>

  <script>
    (() => {
      const adminEmail = 'ssaheror@gmail.com';
      const list = document.getElementById('usersList');
      const count = document.querySelector('.count');
      const users = JSON.parse(localStorage.getItem('ratil-users') || '{}');
      const entries = Object.entries(users).filter(([, user]) => user && typeof user === 'object');

      if (entries.length) {
        list.innerHTML = entries.map(([key, user]) => {
          const email = String(user.email || key || '').trim();
          const username = String(user.username || 'user').trim();
          return `<li><span class="dot"></span><span class="name">${username}</span><span class="email">— ${email}</span></li>`;
        }).join('');
        count.innerHTML = `<strong>Total accounts:</strong> ${entries.length}`;
      }
    })();
  </script>
</body>
</html>
