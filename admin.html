<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#10251f">
  <title>Ratil · المستخدمون المسجلون</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      color-scheme: light;
      --page: #10251f;
      --page-glow: #1b382e;
      --card: #f7f8f4;
      --card-edge: #e2e9e1;
      --ink: #20372f;
      --muted: #64776e;
      --accent: #28775a;
      --accent-soft: #e8f2eb;
      --row: #ffffff;
      --row-edge: #e6ece6;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      padding: clamp(18px, 5vw, 56px) 16px;
      display: grid;
      place-items: start center;
      background: radial-gradient(ellipse at 50% -10%, var(--page-glow), var(--page) 65%);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    main { width: min(100%, 900px); }
    .panel {
      overflow: hidden;
      position: relative;
      padding: clamp(22px, 4vw, 38px);
      background: var(--card);
      border: 1px solid var(--card-edge);
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .24), 0 2px 8px rgba(0, 0, 0, .08);
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: linear-gradient(90deg, #70b58e, #28775a, #174c3d);
    }
    .heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(23px, 4vw, 32px);
      line-height: 1.35;
      letter-spacing: -.3px;
    }
    .english-title {
      display: inline-block;
      margin-inline-start: 7px;
      color: var(--accent);
      font-size: .78em;
      font-weight: 650;
      direction: ltr;
      unicode-bidi: isolate;
    }
    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
      padding: 12px 15px;
      background: var(--accent-soft);
      border: 1px solid #d8e8dc;
      border-radius: 14px;
      color: #355b49;
      font-size: 14px;
    }
    .count {
      flex: 0 0 auto;
      min-width: 34px;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-align: center;
      direction: ltr;
    }
    .users {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .user {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
      padding: 14px 15px;
      background: var(--row);
      border: 1px solid var(--row-edge);
      border-radius: 15px;
      box-shadow: 0 2px 6px rgba(32, 55, 47, .035);
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .user:hover {
      border-color: #bed6c6;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(32, 55, 47, .08);
    }
    .avatar {
      display: grid;
      place-items: center;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(145deg, #e1f0e5, #cce4d4);
      color: #286547;
      font-size: 18px;
      font-weight: 750;
    }
    .user-details { min-width: 0; display: grid; gap: 4px; }
    .user-name { color: var(--ink); font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .user-email {
      color: var(--muted);
      font-size: 14px;
      direction: ltr;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .empty {
      padding: 22px 16px;
      border: 1px dashed #cbd8ce;
      border-radius: 15px;
      color: var(--muted);
      background: #fbfcfa;
      text-align: center;
      line-height: 1.7;
    }
    @media (max-width: 520px) {
      body { padding: 18px 12px; }
      .panel { border-radius: 20px; }
      .heading { display: block; }
      .subtitle { margin-bottom: 19px; }
      .summary { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="pageTitle">
      <header class="heading">
        <h1 id="pageTitle">المستخدمون المسجلون <span class="english-title">Registered users</span></h1>
      </header>
      <p class="subtitle">هذه القائمة تعرض الحسابات المحفوظة في هذا المتصفح فقط، ولا تشمل الأجهزة الأخرى.</p>
      <div class="summary">
        <span>إجمالي الحسابات <span dir="ltr">· Total accounts</span></span>
        <span id="count" class="count" aria-live="polite">0</span>
      </div>
      <ul id="usersList" class="users" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    (() => {
      const list = document.getElementById("usersList");
      const count = document.getElementById("count");
      let users = {};
      try {
        const stored = JSON.parse(localStorage.getItem("ratil-users") || "{}");
        if (stored && typeof stored === "object" && !Array.isArray(stored)) users = stored;
      } catch (_) {}

      const entries = Object.entries(users).filter(([, user]) => user && typeof user === "object");
      count.textContent = String(entries.length);

      if (!entries.length) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "لا توجد حسابات محفوظة في هذا المتصفح.";
        list.appendChild(empty);
        return;
      }

      for (const [key, user] of entries) {
        const email = String(user.email || key || "");
        const username = String(user.username || "مستخدم");
        const item = document.createElement("li");
        item.className = "user";
        const avatar = document.createElement("span");
        avatar.className = "avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.textContent = username.trim().charAt(0) || "م";
        const details = document.createElement("span");
        details.className = "user-details";
        const name = document.createElement("span");
        name.className = "user-name";
        name.textContent = username;
        const address = document.createElement("span");
        address.className = "user-email";
        address.textContent = email;
        details.append(name, address);
        item.append(avatar, details);
        list.appendChild(item);
      }
    })();
  </script>
</body>
</html>
