<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ratil · Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
    .admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    #notice{color:var(--mute)}
    .danger{background:#a83232;color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
  </style>
</head>
<body>
<main>
  <div class="admin-head">
    <div><h1>Ratil · Admin</h1><div class="sub">لوحة إدارة المستخدمين</div></div>
    <a href="index.html" style="color:var(--accent)">العودة للموقع</a>
  </div>
  <section class="admin-card">
    <h2>حذف جميع الحسابات وتسجيل خروج المشرف</h2>
    <p id="notice">جارٍ التحقق من الحساب…</p>
    <p>سيحذف هذا الإجراء كل الحسابات المحلية، بما فيها حساب المشرف، من هذا المتصفح فقط، ثم يسجّل خروجك. لا يمكن التراجع عن الحذف.</p>
    <button id="clearAll" class="danger" type="button" hidden>حذف كل الحسابات وتسجيل الخروج</button>
  </section>
</main>
<script>
(() => {
  const ADMIN_EMAIL = "ssaheror@gmail.com";
  const notice = document.getElementById("notice");
  const clearButton = document.getElementById("clearAll");
  const sessionEmail = (localStorage.getItem("ratil-session") || "").toLowerCase();
  if (sessionEmail !== ADMIN_EMAIL) {
    notice.textContent = "غير مصرح لك. يجب تسجيل الدخول بحساب المشرف.";
    setTimeout(() => { window.location.replace("index.html"); }, 1600);
    return;
  }
  notice.textContent = "تم التحقق من جلسة المشرف. الحسابات محفوظة في هذا المتصفح فقط.";
  clearButton.hidden = false;
  clearButton.addEventListener("click", () => {
    if ((localStorage.getItem("ratil-session") || "").toLowerCase() !== ADMIN_EMAIL) {
      notice.textContent = "غير مصرح لك بهذا الإجراء.";
      clearButton.hidden = true;
      return;
    }
    const confirmed = window.confirm("تأكيد نهائي: سيتم حذف جميع الحسابات بما فيها حساب المشرف من هذا المتصفح، ثم تسجيل خروجك. هل تريد المتابعة؟");
    if (!confirmed) return;
    localStorage.removeItem("ratil-users");
    localStorage.removeItem("ratil-session");
    notice.textContent = "تم حذف جميع الحسابات المحلية وتسجيل الخروج. سيتم تحويلك إلى الموقع.";
    clearButton.hidden = true;
    setTimeout(() => { window.location.replace("index.html"); }, 1200);
  });
})();
</script>
</body>
</html>
