<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102019">
  <title>Ratil · إدارة المستخدمين</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0c1d17;
      --page-glow: #18382b;
      --surface: #f7f9f6;
      --surface-border: #dce5dd;
      --card: #fff;
      --ink: #20372d;
      --muted: #52665a;
      --green: #23734d;
      --green-soft: #e6f2e9;
      --line: #dce5dd;
      --danger: #c64035;
      --danger-hover: #a92e26;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(20px, 5vw, 48px) 16px;
      background: radial-gradient(ellipse at top, var(--page-glow), var(--page) 68%);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }
    main { width: min(100%, 900px); margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      color: #f2f7f3;
    }
    h1 { margin: 0; font-size: clamp(23px, 4vw, 30px); }
    .subtitle { margin: 6px 0 0; color: #c3d2c8; font-size: 14px; }
    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 9px 14px;
      border: 1px solid #496052;
      border-radius: 11px;
      background: #1b3025;
      color: #f2f7f3;
      text-decoration: none;
    }
    .back-link:hover { border-color: #9dc7aa; }
    .panel {
      overflow: hidden;
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--surface-border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 22px 60px #0005;
    }
    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    h2 { margin: 0; color: var(--ink); font-size: 20px; }
    .count, .admin-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 5px 11px;
      border: 1px solid #b9d9c2;
      border-radius: 999px;
      background: var(--green-soft);
      color: #205b3b;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    #notice {
      min-height: 24px;
      margin: 10px 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .search-wrap { margin: 0 0 14px; }
    #userSearch {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px 13px;
      border: 1px solid #bdcfc1;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
    }
    #userSearch::placeholder { color: #687b6e; }
    #userSearch:focus-visible { outline: 3px solid #78b98b; outline-offset: 2px; }
    #userList { display: grid; gap: 11px; }
    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
      box-shadow: 0 2px 7px #1835270c;
    }
    .user-info { display: grid; gap: 6px; min-width: 0; }
    .user-name { color: var(--ink); font-size: 16px; font-weight: 750; overflow-wrap: anywhere; }
    .user-email {
      color: #455b4d;
      direction: ltr;
      text-align: right;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    .admin-badge { width: fit-content; margin-top: 2px; }
    .delete-button {
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--danger);
      border-radius: 10px;
      background: var(--danger);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .delete-button:hover { background: var(--danger-hover); border-color: var(--danger-hover); }
    .empty {
      padding: 22px;
      border: 1px dashed #b9c9bd;
      border-radius: 14px;
      background: #fff;
      color: #455b4d;
      text-align: center;
    }
    button:focus-visible, a:focus-visible { outline: 3px solid #78b98b; outline-offset: 3px; }
    @media (max-width: 520px) {
      .panel { padding: 18px; }
      .user-card { align-items: flex-start; }
      .delete-button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>إدارة المستخدمين</h1>
        <p class="subtitle">الحسابات المسجلة في هذا المتصفح</p>
      </div>
      <a class="back-link" href="index.html">العودة للموقع</a>
    </header>

    <section class="panel" aria-labelledby="usersTitle">
      <div class="panel-heading">
        <h2 id="usersTitle">المستخدمون المسجلون</h2>
        <span id="count" class="count">0 حساب</span>
      </div>
      <p id="notice" role="status">جارٍ تحميل الحسابات…</p>
      <div class="search-wrap">
        <input id="userSearch" type="search" placeholder="ابحث بالاسم أو البريد الإلكتروني" aria-label="ابحث عن مستخدم">
      </div>
      <div id="userList"></div>
    </section>
  </main>

  <script>
    (() => {
      const ADMIN_EMAIL = "ssaheror@gmail.com";
      const notice = document.getElementById("notice");
      const count = document.getElementById("count");
      const userList = document.getElementById("userList");
      const userSearch = document.getElementById("userSearch");

      function isAdminSession() {
        return (localStorage.getItem("ratil-session") || "").trim().toLowerCase() === ADMIN_EMAIL;
      }

      if (!isAdminSession()) {
        notice.textContent = "غير مصرح لك بعرض هذه الصفحة. سجّل الدخول بحساب المشرف.";
        userSearch.disabled = true;
        setTimeout(() => location.replace("index.html"), 1800);
        return;
      }

      function readUsers() {
        try {
          const parsed = JSON.parse(localStorage.getItem("ratil-users") || "{}");
          return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
        } catch {
          return {};
        }
      }

      function renderUsers(message = "") {
        const users = readUsers();
        const entries = Object.entries(users).filter(([, user]) => user && typeof user === "object");
        const query = userSearch.value.trim().toLowerCase();
        const filtered = entries.filter(([key, user]) => {
          const email = String(user.email || key);
          const username = String(user.username || "مستخدم");
          return !query || email.toLowerCase().includes(query) || username.toLowerCase().includes(query);
        });

        count.textContent = `${entries.length} ${entries.length === 1 ? "حساب" : "حسابات"}`;
        notice.textContent = message || "يمكنك حذف أي حساب مستخدم؛ حساب المشرف محمي.";
        userList.replaceChildren();

        if (!filtered.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = entries.length ? "لا توجد نتائج تطابق البحث." : "لا توجد حسابات محفوظة في هذا المتصفح.";
          userList.appendChild(empty);
          return;
        }

        for (const [key, user] of filtered) {
          const email = String(user.email || key).trim();
          const isAdmin = email.toLowerCase() === ADMIN_EMAIL;
          const card = document.createElement("article");
          card.className = "user-card";
          const info = document.createElement("div");
          info.className = "user-info";
          const name = document.createElement("div");
          name.className = "user-name";
          name.textContent = String(user.username || "مستخدم");
          const address = document.createElement("div");
          address.className = "user-email";
          address.textContent = email;
          info.append(name, address);

          if (isAdmin) {
            const badge = document.createElement("span");
            badge.className = "admin-badge";
            badge.textContent = "حساب المشرف · محمي";
            info.appendChild(badge);
          }
          card.appendChild(info);

          if (!isAdmin) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "delete-button";
            button.textContent = "حذف الحساب";
            button.addEventListener("click", () => {
              if (!isAdminSession()) {
                notice.textContent = "انتهت الجلسة؛ سجّل الدخول مجددًا بحساب المشرف.";
                return;
              }
              if (!confirm(`هل تريد حذف حساب ${email} من هذا المتصفح؟`)) return;

              const latestUsers = readUsers();
              for (const [storedKey, storedUser] of Object.entries(latestUsers)) {
                const storedEmail = String(storedUser && storedUser.email || storedKey).trim().toLowerCase();
                if (storedEmail === email.toLowerCase() && storedEmail !== ADMIN_EMAIL) {
                  delete latestUsers[storedKey];
                }
              }
              try {
                localStorage.setItem("ratil-users", JSON.stringify(latestUsers));
                renderUsers("تم حذف الحساب من هذا المتصفح.");
              } catch {
                notice.textContent = "تعذّر تحديث الحسابات في هذا المتصفح.";
              }
            });
            card.appendChild(button);
          }
          userList.appendChild(card);
        }
      }

      userSearch.addEventListener("input", () => renderUsers());
      window.addEventListener("storage", event => {
        if (event.key === "ratil-users") renderUsers("تم تحديث قائمة الحسابات.");
      });
      renderUsers();
    })();
  </script>
</body>
</html>
