<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Ratil · إدارة المستخدمين</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #102019;
      --bg-glow: #1b382b;
      --panel: #1b2b22;
      --card: #22352a;
      --line: #354b3c;
      --text: #edf4ee;
      --muted: #a4b5a8;
      --green: #4ab981;
      --green-soft: #244a35;
      --red: #d65b4e;
      --red-hover: #ed6b59;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      background: radial-gradient(ellipse at top, var(--bg-glow), var(--bg) 68%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main { width: min(100%, 760px); margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: 25px; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px 13px;
      background: var(--panel);
    }

    a:hover { border-color: var(--green); }

    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(27, 43, 34, .96);
      box-shadow: 0 18px 50px #0004;
    }

    .panel-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    h2 { margin: 0; font-size: 19px; }

    .count, .admin-badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid #42644c;
      border-radius: 999px;
      background: var(--green-soft);
      color: #bcebd0;
      padding: 5px 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    #notice {
      min-height: 24px;
      margin: 10px 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    #userList { display: grid; gap: 11px; }

    .user-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .user-info { min-width: 0; display: grid; gap: 5px; }
    .user-name { font-weight: 700; overflow-wrap: anywhere; }
    .user-email {
      color: var(--muted);
      direction: ltr;
      text-align: right;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .admin-badge { width: fit-content; }

    .delete-button {
      border: 1px solid #e27562;
      border-radius: 10px;
      padding: 9px 13px;
      background: var(--red);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }

    .delete-button:hover { background: var(--red-hover); transform: translateY(-1px); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

    .empty {
      padding: 22px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .panel { padding: 16px; }
      .user-card { align-items: flex-start; }
      .delete-button { width: 100%; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>إدارة المستخدمين</h1>
        <p class="subtitle">إدارة الحسابات المحفوظة في هذا المتصفح</p>
      </div>
      <a href="index.html">العودة للموقع</a>
    </header>

    <section class="panel" aria-labelledby="usersTitle">
      <div class="panel-heading">
        <h2 id="usersTitle">الحسابات المسجلة</h2>
        <span id="count" class="count">0 حساب</span>
      </div>
      <p id="notice" role="status">جارٍ تحميل الحسابات…</p>
      <div id="userList"></div>
    </section>
  </main>

  <script>
    (() => {
      const ADMIN_EMAIL = "ssaheror@gmail.com";
      const notice = document.getElementById("notice");
      const count = document.getElementById("count");
      const userList = document.getElementById("userList");

      function isAdminSession() {
        return (localStorage.getItem("ratil-session") || "").toLowerCase() === ADMIN_EMAIL;
      }

      if (!isAdminSession()) {
        notice.textContent = "غير مصرح لك بعرض هذه الصفحة. سجّل الدخول بحساب المشرف.";
        setTimeout(() => location.replace("index.html"), 1600);
        return;
      }

      function readUsers() {
        try {
          const value = JSON.parse(localStorage.getItem("ratil-users") || "{}");
          return value && typeof value === "object" && !Array.isArray(value) ? value : {};
        } catch {
          return {};
        }
      }

      function renderUsers(message = "") {
        const users = readUsers();
        const entries = Object.entries(users).filter(([, user]) => user && typeof user === "object");

        count.textContent = `${entries.length} حساب`;
        notice.textContent = message || "حساب المشرف محمي ولا يمكن حذفه من هذه الصفحة.";
        userList.replaceChildren();

        if (!entries.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "لا توجد حسابات محفوظة في هذا المتصفح.";
          userList.appendChild(empty);
          return;
        }

        for (const [key, user] of entries) {
          const email = String(user.email || key).trim();
          const isAdmin = email.toLowerCase() === ADMIN_EMAIL;

          const card = document.createElement("article");
          card.className = "user-card";

          const info = document.createElement("div");
          info.className = "user-info";

          const name = document.createElement("div");
          name.className = "user-name";
          name.textContent = user.username || "مستخدم";

          const emailNode = document.createElement("div");
          emailNode.className = "user-email";
          emailNode.textContent = email;

          info.append(name, emailNode);

          if (isAdmin) {
            const badge = document.createElement("span");
            badge.className = "admin-badge";
            badge.textContent = "حساب المشرف";
            info.appendChild(badge);
          }

          card.appendChild(info);

          if (!isAdmin) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "delete-button";
            button.textContent = "حذف الحساب";
            button.addEventListener("click", () => {
              if (!isAdminSession()) {
                notice.textContent = "انتهت الجلسة أو لا تملك صلاحية الحذف.";
                return;
              }

              if (!confirm(`هل تريد حذف حساب ${email} من هذا المتصفح؟`)) return;

              const latestUsers = readUsers();
              for (const [storedKey, storedUser] of Object.entries(latestUsers)) {
                const storedEmail = String(storedUser && storedUser.email || storedKey).trim().toLowerCase();
                if (storedEmail === email.toLowerCase() && storedEmail !== ADMIN_EMAIL) {
                  delete latestUsers[storedKey];
                }
              }

              try {
                localStorage.setItem("ratil-users", JSON.stringify(latestUsers));
                renderUsers("تم حذف الحساب.");
              } catch {
                notice.textContent = "تعذّر تحديث الحسابات في التخزين المحلي.";
              }
            });

            card.appendChild(button);
          }

          userList.appendChild(card);
        }
      }

      renderUsers();
    })();
  </script>
</body>
</html>
